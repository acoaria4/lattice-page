<!doctype html>
<html lang="en-IN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080d17">
  <meta name="description" content="Explore two versions of Lattice and two interactive studies about how an index works.">
  <title>Choose a version | Lattice</title>
  <link rel="icon" href="/lattice-page/assets/emblem-mark-C0U1a7vX.webp" type="image/webp">
  <link rel="stylesheet" crossorigin href="/lattice-page/assets/picker-CaxuLMmK.css">
</head>
<body>
  <header class="shell header">
    <div class="brand">
      <img class="brand__emblem" src="/lattice-page/assets/emblem-mark-C0U1a7vX.webp" alt="" width="360" height="136">
      <img class="brand__wordmark" src="/lattice-page/media/wordmark.webp" alt="Lattice" width="180" height="22">
    </div>
  </header>

  <main class="shell">
    <div class="intro">
      <h1>Choose a version<span>.</span></h1>
      <p>Explore two versions of Lattice and two interactive index studies.</p>
    </div>

    <nav class="versions" aria-label="Versions and studies">
      <a class="version version--v1" href="/lattice-page/v1/" aria-labelledby="v1-label v1-title">
        <div class="version__art">
          <img src="/lattice-page/media/hero.webp" alt="" width="1672" height="941">
        </div>
        <div class="version__details">
          <div>
            <span class="version__number" id="v1-label">V1</span>
            <h2 id="v1-title">See the bigger picture.</h2>
          </div>
          <span class="version__arrow" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4.5 12h14m-6-6 6 6-6 6"/></svg></span>
        </div>
      </a>

      <a class="version version--v2" href="/lattice-page/v2/" aria-labelledby="v2-label v2-title">
        <div class="version__art">
          <img src="/lattice-page/assets/emblem-poster-jULB_buH.webp" alt="" width="1280" height="482">
        </div>
        <div class="version__details">
          <div>
            <span class="version__number" id="v2-label">V2</span>
            <h2 id="v2-title">From one to many.</h2>
          </div>
          <span class="version__arrow" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4.5 12h14m-6-6 6 6-6 6"/></svg></span>
        </div>
      </a>

      <a class="version version--trace" href="/lattice-page/study/" aria-labelledby="trace-label trace-title">
        <div class="version__art">
          <img src="/lattice-page/assets/trace-result-BgLnxDv2.webp" alt="" width="1672" height="941">
        </div>
        <div class="version__details">
          <div>
            <span class="version__number" id="trace-label">Index weights</span>
            <h2 id="trace-title">Trace the Move</h2>
          </div>
          <span class="version__arrow" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4.5 12h14m-6-6 6 6-6 6"/></svg></span>
        </div>
      </a>

      <a class="version version--review" href="/lattice-page/index-review/" aria-labelledby="review-label review-title">
        <div class="version__art">
          <img src="/lattice-page/assets/review-preview-BgaNCKj7.png" alt="" width="875" height="490">
        </div>
        <div class="version__details">
          <div>
            <span class="version__number" id="review-label">Index review</span>
            <h2 id="review-title">Inside the Index</h2>
          </div>
          <span class="version__arrow" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4.5 12h14m-6-6 6 6-6 6"/></svg></span>
        </div>
      </a>
    </nav>
  </main>
</body>
</html>
